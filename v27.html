<title>Kaninchenschau Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: Kopfband mit Schau-Name, Reiter in Ablauf-Reihenfolge, darunter ein Arbeitsbereich pro Schritt. Papier (Karten, Katalog) bleibt in beiden Themes weiß. */
:root{
  --bg:#f6f7ef; --surface:#ffffff; --surface-2:#e9f0dc; --ink:#1f2a14; --muted:#5b6a4b;
  --line:#d5e1c3; --accent:#4f6b2a; --accent-ink:#ffffff; --win:#2b7a46; --win-soft:#e0f2e4;
  --leaf:#4f6b2a; --leaf-2:#57bb6e; --warn:#b5651d; --warn-soft:#fff1e0; --fehlt:#ffd3a1; --fehlt-line:#d9822b; --nbr:#f7b9b2; --nbr-line:#c0392b;
  --gast:#e6ecff; --gast-ink:#3346a3; --jug:#fff2c7; --jug-ink:#7a5600;
  --paper:#ffffff; --paper-ink:#1d1a1c; --paper-soft:#8a7f86; --paper-line:#cfc6cb; --paper-accent:#4f6b2a; --paper-tint:#eef4e4;
  --font:"Poppins","Segoe UI",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141812; --surface:#1c2119; --surface-2:#2a3324; --ink:#eef3e6; --muted:#a9b99a; --line:#34412b;
  --accent:#9ccc66; --accent-ink:#15200b; --win:#6fd39b; --win-soft:#1f3a2b; --leaf:#3d5321; --leaf-2:#2f6b3e; --warn:#f0a35b; --warn-soft:#3b2a17; --fehlt:#5a3a17; --fehlt-line:#e3934a; --nbr:#5e1f1c; --nbr-line:#e5675c;
  --gast:#25305a; --gast-ink:#c4cdff; --jug:#43380f; --jug-ink:#ffe08a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141812; --surface:#1c2119; --surface-2:#2a3324; --ink:#eef3e6; --muted:#a9b99a; --line:#34412b;
  --accent:#9ccc66; --accent-ink:#15200b; --win:#6fd39b; --win-soft:#1f3a2b; --leaf:#3d5321; --leaf-2:#2f6b3e; --warn:#f0a35b; --warn-soft:#3b2a17; --fehlt:#5a3a17; --fehlt-line:#e3934a; --nbr:#5e1f1c; --nbr-line:#e5675c;
  --gast:#25305a; --gast-ink:#c4cdff; --jug:#43380f; --jug-ink:#ffe08a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:20px}
p{text-wrap:pretty;margin:0}
.wrap{max-width:none;margin:0 auto;padding-left:max(16px,2vw,env(safe-area-inset-left,0px));padding-right:max(16px,2vw,env(safe-area-inset-right,0px));padding-block:24px 48px}
header.top{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:56px 200px 24px 48px;min-height:184px}
header.top>*{position:relative;z-index:1}
header.top .deco{position:absolute;z-index:0;pointer-events:none}
header.top .d1{left:0;top:0;width:150px;height:auto;fill:var(--leaf)}
header.top .d3{right:6px;bottom:-20px;width:170px;height:auto;fill:var(--leaf-2)}
header.top .hase{position:absolute;right:14px;bottom:0;height:172px;width:auto;z-index:0;pointer-events:none}
header.top h1{font-size:30px;line-height:36px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;color:var(--accent)}
header.top .sub{text-transform:uppercase;letter-spacing:.14em;font-size:12px;line-height:18px;color:var(--ink)}
@media (max-width:640px){header.top{padding:48px 24px 20px;min-height:0}header.top .hase,header.top .d3{display:none}header.top .d1{width:130px}header.top h1{font-size:22px;line-height:28px}}
.pageleaf{position:fixed;z-index:0;pointer-events:none;fill:var(--leaf-2);opacity:.9}
.pageleaf.l1{left:-30px;bottom:-30px;width:230px}
.pageleaf.l2{right:-20px;top:-20px;width:200px;fill:var(--leaf)}
.pageleaf{display:none}
.wrap{position:relative;z-index:1}
.brand{display:flex;gap:12px;align-items:center}
h1,h2,h3{font-weight:600;text-wrap:balance;margin:0}
h1{font-size:24px;line-height:32px}
h2{font-size:20px;line-height:28px}
h3{font-size:16px;line-height:24px;font-weight:500}
.sub{color:var(--muted);font-size:14px;line-height:20px}
.tag{display:inline-block;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:2px 8px;border-radius:9999px;background:var(--warn-soft);color:var(--warn)}
nav.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:4px 4px 8px;margin-bottom:24px}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;line-height:20px;padding:8px 16px;border-radius:9999px;display:flex;gap:8px;align-items:center;transition:background-color .3s var(--ease),color .3s var(--ease),transform .3s var(--ease)}
nav.tabs a:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs a:active{transform:scale(.98)}
nav.tabs a .n{font-size:12px;line-height:16px;width:24px;height:24px;border-radius:9999px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs a[aria-current="page"] .n{background:var(--accent-ink);color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within>.pill{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.between{justify-content:space-between;align-items:center}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:16px;font-weight:500;color:var(--muted)}
label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;line-height:20px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0;transition:border-color .3s var(--ease)}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
textarea{min-height:96px;resize:vertical;line-height:20px}
button{font:inherit;font-size:16px;line-height:24px;font-weight:600;border:0;border-radius:9999px;padding:8px 12px;cursor:pointer;background:var(--accent);color:var(--accent-ink);transition:transform .3s var(--ease),opacity .3s var(--ease)}
button:hover{transform:translateY(-1px);opacity:.92}
button:active{transform:scale(.98)}
button.ghost{background:var(--surface-2);color:var(--ink)}
button.small{padding:4px 12px;font-size:14px;line-height:20px}
button.icon{padding:4px 8px;font-size:14px;line-height:20px;background:var(--surface-2);color:var(--ink)}
button:disabled{opacity:.4;cursor:default;transform:none}
.hint{font-size:14px;line-height:20px;color:var(--muted)}
.note{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:14px;line-height:20px}
.note b{color:var(--warn)}
.ok-note{background:var(--win-soft);color:var(--ink);border-radius:12px;padding:12px 16px}
.ok-note b{color:var(--win)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
#hbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:6px;height:30px;padding:4px 6px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.10);user-select:none;-webkit-user-select:none}
#hbar button{flex:none;width:28px;height:22px;padding:0;font-size:12px;line-height:22px;border-radius:9999px;background:var(--surface-2);color:var(--ink)}
#hbar .trk{position:relative;flex:1;height:14px;border-radius:9999px;background:var(--surface-2);cursor:pointer;touch-action:none}
#hbar .thb{position:absolute;top:0;left:0;height:14px;min-width:32px;border-radius:9999px;background:var(--accent);cursor:grab;touch-action:none}
#hbar .thb:active{cursor:grabbing}
.tbl::-webkit-scrollbar{height:14px}
.tbl::-webkit-scrollbar-track{background:var(--surface-2)}
.tbl::-webkit-scrollbar-thumb{background:var(--accent);border-radius:9999px;border:3px solid var(--surface-2)}
.tbl{scrollbar-color:var(--accent) var(--surface-2)}
#hbar::-webkit-scrollbar{height:14px}
#hbar::-webkit-scrollbar-track{background:var(--surface-2)}
#hbar::-webkit-scrollbar-thumb{background:var(--accent);border-radius:9999px;border:3px solid var(--surface-2)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;line-height:20px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;line-height:16px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td input{padding:4px 8px}
.sex{font-weight:600}
.pill{display:inline-block;font-size:12px;line-height:16px;font-weight:600;border-radius:9999px;padding:2px 8px;background:var(--surface-2);color:var(--ink)}
.pill.gast{background:var(--gast);color:var(--gast-ink)}
.pill.jugend{background:var(--jug);color:var(--jug-ink)}
.pill.win{background:var(--win-soft);color:var(--win)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
label.filebtn{cursor:pointer;flex-direction:row}
label.filebtn .pill{font-size:14px;line-height:20px;padding:4px 12px;transition:transform .3s var(--ease)}
label.filebtn:hover .pill{transform:translateY(-1px)}
.pos{width:54px;text-align:right;padding:4px 6px;font-variant-numeric:tabular-nums}
.pos.ok{border-color:var(--win)}
.pos.bad{border-color:var(--warn);background:var(--warn-soft)}
th.ph{font-size:11px;line-height:14px;text-align:right;padding:6px 4px;white-space:nowrap}
.tbl th.kf,.tbl td.kf{position:sticky;left:0;z-index:1;background:var(--surface);width:56px;min-width:56px;max-width:56px;font-size:16px}
.tbl th.ge2,.tbl td.ge2{position:sticky;left:56px;z-index:1;background:var(--surface);width:52px;min-width:52px;max-width:52px}
.tbl th.ge2{background:var(--surface-2)}
#bTbl th.au2,#bTbl td.au2{left:108px}
.tbl th.au2,.tbl td.au2{position:sticky;left:56px;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.tbl th.au2{background:var(--surface-2)}
.tbl th.kf{background:var(--surface-2);font-size:12px}
.pts{width:80px;text-align:right;font-variant-numeric:tabular-nums}
.pts.ok{border-color:var(--win)}
.pts.bad{border-color:var(--warn);background:var(--warn-soft)}
/* fehlt-Strecke: vom fehlt-Feld bis Gesamt orange */
.pos.fx,.pts.fx{background:var(--fehlt);border-color:var(--fehlt-line)}
/* nb-Strecke: vom nb-Feld bis Gesamt rot */
.pos.nbx,.pts.nbx{background:var(--nbr);border-color:var(--nbr-line)}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.award{border:1.5px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.award .t{font-size:12px;line-height:16px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--muted)}
.award .w{font-size:18px;line-height:28px;font-weight:600}
.award .d{font-size:14px;line-height:20px;color:var(--muted)}
.award.has{border-color:var(--win);background:var(--win-soft)}
.award.has .w{color:var(--win)}
.award.wide{grid-column:1/-1}
.award ol{margin:4px 0 0;padding-left:20px;columns:2 300px;column-gap:24px;font-size:14px;line-height:22px}
.gwlist{display:grid;gap:16px}
.gw{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:start}
.gw .ph{width:120px;aspect-ratio:3/4;border-radius:12px;background:var(--surface-2);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;overflow:hidden;max-width:100%}
.gw .ph img{width:100%;height:100%;object-fit:cover}
@media (max-width:560px){.gw{grid-template-columns:1fr}}
.gwnum{font-size:12px;line-height:16px;font-weight:600;color:var(--accent)}
.sr{position:absolute;left:-9999px}
.skip{position:absolute;left:-9999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:9999px;z-index:20}
.skip:focus{left:16px}

/* ---------- Papier: ZDRK Karten ---------- */
.cardrow{display:flex;flex-wrap:wrap;gap:16px}
.cardbox{width:calc(105mm * var(--s));height:calc(148.5mm * var(--s));--s:.62;position:relative;flex:none;max-width:100%}
.cardbox .pc{transform:scale(var(--s));transform-origin:0 0;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.pc{position:absolute;left:0;top:0;width:105mm;height:148.5mm;background:var(--paper);color:var(--paper-ink);font-family:var(--font);font-size:9pt;line-height:1.2;overflow:hidden}
.pc .a{position:absolute;white-space:nowrap}
.pc .ln{border-bottom:.25mm solid #444;height:5.2mm;text-align:center;font-weight:600;font-size:10pt;padding-top:.6mm}
.pc .lbl{font-size:9.5pt}
.pc .ttl{font-size:16.5pt;font-weight:600;text-align:center}
.pc .sub2{font-size:11pt;text-align:center}
.pc .schau{font-size:9pt;font-weight:600;text-align:center}
.pc table{border-collapse:collapse;table-layout:fixed;font-size:8pt;font-variant-numeric:tabular-nums}
.pc td{border:.25mm solid #444;padding:.6mm 1mm;vertical-align:top;white-space:nowrap;color:var(--paper-ink);line-height:1.2}
.pc td.c{text-align:center;vertical-align:middle;font-size:9.5pt}
.pc td.r{text-align:right}
.pc .sig{text-align:center;font-size:9.5pt;border-bottom:.25mm solid #444;height:5mm}
.pc .sigl{text-align:center;font-size:6.5pt;color:#555}
.pc .logozone{position:absolute;left:8mm;top:3mm;width:13mm;height:17mm;border:.3mm dashed #c9c0c5;border-radius:6mm;font-size:6pt;color:#a99fa5;display:grid;place-items:center}
.pc .testmark{position:absolute;left:0;right:0;top:66mm;text-align:center;font-size:30pt;font-weight:600;color:rgba(79,107,42,.12);transform:rotate(-28deg)}
.pc .nv{text-align:center;font-size:14pt;font-weight:600;line-height:1.3;background:#fff;padding:3mm 0;border:.4mm solid #444;white-space:normal}
.pc.frame{}

/* ---------- Papier: Katalog ---------- */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:8px;box-shadow:0 2px 16px rgba(0,0,0,.12);max-width:210mm;width:100%;padding:16mm 14mm;font-size:13px;line-height:18px}
.cat h1,.cat h2,.cat h3{color:var(--paper-ink)}
.cat .pb{border-top:2px dashed var(--line);margin:32px -14mm;height:0}
.cat .cover{text-align:center;padding:24px 0 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
.cat .cover .kick{font-size:12px;line-height:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--paper-accent);font-weight:600}
.cat .cover h1{font-size:48px;line-height:1;letter-spacing:-.01em}
.cat .cover .v{font-size:18px;line-height:28px;font-weight:500}
.cat .cover .d{font-size:16px;line-height:24px;color:var(--paper-soft)}
.cat .gwp{display:grid;grid-template-columns:1fr 46mm;gap:8mm;align-items:start}
.cat .gwp h2{font-size:30px;line-height:36px;margin-bottom:12px}
.cat .gwp p{font-size:14px;line-height:20px;margin:0 0 10px;text-align:justify;hyphens:auto}
.cat .gwp img{width:46mm;aspect-ratio:3/4;object-fit:cover;border-radius:4mm;max-width:100%}
.cat .gwp .sg{margin-top:16px;font-weight:600;white-space:pre-line}
.cat .gwp .fu{color:var(--paper-soft);font-weight:400}
.cat .gwp.nobild{grid-template-columns:1fr}
.gwe{border:1px solid var(--line);border-radius:12px;padding:12px;gap:8px}
.gwe img{width:64px;height:85px;object-fit:cover;border-radius:8px}
.tbl tr.sgTop>td{border-top:3px solid var(--ink)}
.tbl tr.sgEnd>td{border-bottom:3px solid var(--ink)}
#bTbl tr.sgTop>td{border-top-width:2px}
#bTbl tr.sgEnd>td{border-bottom-width:2px}
.ez{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.cat td.prl{width:6mm;text-align:center;font-weight:600}
.cat td.zg .ez{color:var(--paper-soft);font-size:9.5px}
.cat .leg{border:1.5px solid var(--paper-line);border-radius:4mm;padding:4mm 6mm;margin:6mm 0;break-inside:avoid;display:grid;grid-template-columns:repeat(auto-fit,minmax(55mm,1fr));gap:3mm 8mm;font-size:11.5px;line-height:16px}
.cat .leg h2{grid-column:1/-1;font-size:18px;line-height:24px}
.cat .leg h3{font-size:12px;line-height:16px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--paper-accent);margin-bottom:1mm}
.cat .leg table{font-size:11.5px;width:auto}
.cat .leg td{padding:.3mm 3mm .3mm 0;white-space:normal}
.cat .leg td:first-child{white-space:nowrap}
.cat .pend{border:1.5px dashed var(--paper-line);border-radius:4mm;padding:8mm;text-align:center;color:var(--paper-soft)}
.cat .ad{border:1.5px solid var(--paper-line);border-radius:4mm;padding:4mm 6mm;margin:6mm 0;display:flex;flex-direction:column;gap:2px;break-inside:avoid}
.cat .ad b{font-size:16px;line-height:24px}
.cat .ad .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-soft)}
.cat h2.abt{font-size:20px;line-height:28px;margin:10mm 0 2mm;padding:2mm 4mm;background:var(--paper-tint);color:var(--paper-accent);border-radius:2mm;break-after:avoid}
.cat h3.rf{font-size:15px;line-height:20px;font-weight:600;margin:5mm 0 1mm;break-after:avoid}
.cat table{font-size:11.5px;line-height:15px;font-variant-numeric:tabular-nums;width:100%;border-collapse:collapse}
.cat th{background:none;color:var(--paper-soft);font-size:9.5px;line-height:12px;padding:1mm 1.5mm;border-bottom:.3mm solid var(--paper-ink);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.cat td{padding:.8mm 1.5mm;border-bottom:0;color:var(--paper-ink);white-space:nowrap;vertical-align:top}
.cat tbody.unit{break-inside:avoid}
.cat tbody.unit tr:first-child td{border-top:.2mm solid var(--paper-line)}
.cat td.zg{font-weight:600;width:11mm}
.cat td.k{width:9mm;text-align:right;font-weight:600}
.cat td.au{width:40mm;white-space:normal}
.cat th.ps,.cat td.ps{text-align:right;padding:.8mm .5mm;font-size:10px;width:6.6mm}
.cat td.pt{text-align:right;width:12mm}
.cat td.pd{width:8mm;color:var(--paper-soft)}
.cat td.pr{white-space:normal}
.cat td.vk{text-align:right;width:14mm}
.cat tr.sum td{font-weight:600}
.cat .bad{display:inline-block;font-size:9.5px;line-height:12px;font-weight:600;border-radius:9999px;padding:1px 6px;background:var(--paper-tint);color:var(--paper-accent);margin:0 2px 1px 0}
.cat .sieger td{border-bottom:.2mm solid var(--paper-line);white-space:normal}
.mb .kick{font-size:11px;line-height:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-accent);font-weight:600}
.mb h1{font-size:26px;line-height:32px;margin:2px 0 4px}
.mb .meta{color:var(--paper-soft);font-size:13px;line-height:18px}
.mb table td{vertical-align:middle;border-bottom:.2mm solid var(--paper-line);height:10mm}
.mb th.um,.mb td.um{border-left:.3mm solid var(--paper-ink);width:50mm}
.mb td.fee{white-space:nowrap;width:22mm}
.mb .fb{color:var(--paper-soft)}
.mb tr.zs td{height:7mm;font-size:11px;color:var(--paper-soft);background:var(--paper-tint)}
.mb table.kosten{width:auto;min-width:120mm;margin:8mm 0 0 auto;font-size:12.5px}
.mb table.kosten td{height:8mm;border-bottom:.2mm solid var(--paper-line);padding:1mm 3mm;white-space:nowrap}
.mb table.kosten td.b{text-align:right;font-variant-numeric:tabular-nums;min-width:34mm}
.mb table.kosten tr.sub td{font-weight:600;border-bottom:.4mm solid var(--paper-ink)}
.mb table.kosten tr.tot td{font-weight:600;font-size:14px;border-bottom:0}
.mb .legal{font-size:10.5px;line-height:14px;color:var(--paper-soft);margin:4mm 0 0}
.ma .msch{font-size:16px;font-weight:600}
.ma table.kopf td{border:0;border-bottom:.2mm solid var(--paper-line);height:7mm;font-size:13px}
.ma table.kopf td:first-child{width:22mm;font-weight:600}
.ma .grid4{display:grid;grid-template-columns:1fr 1fr;gap:3mm 8mm;margin-top:4mm;font-size:13px}
.ma .bx{display:inline-block;width:3.6mm;height:3.6mm;border:.3mm solid var(--paper-ink);vertical-align:-.6mm}
.ma .ablk{margin-top:5mm;break-inside:avoid}
.ma .ah{font-size:13px;margin-bottom:1mm}
.ma .ablk table td{height:7.5mm;border:.2mm solid var(--paper-line)}
.ma .ablk table th{border-bottom:.3mm solid var(--paper-ink);font-size:10px}
.ma .ablk td.c{text-align:center}
.ma .afoot{display:grid;grid-template-columns:1.2fr 1fr;gap:8mm;margin-top:6mm;align-items:start}
.mb .foot{margin-top:8mm;display:grid;gap:6mm;font-size:12px;line-height:17px}
.mb .line{display:inline-block;min-width:35mm;border-bottom:.3mm solid var(--paper-ink);height:5mm}
.mb .sigs{display:flex;gap:16mm;flex-wrap:wrap;margin-top:12mm;font-size:12px;color:var(--paper-soft)}
.cat .idx{columns:2;column-gap:10mm;font-size:12px;line-height:17px}
.cat .idx div{break-inside:avoid}

#print{display:none}
@page{size:A4}
@page card{size:A4;margin:0}
@page cat{size:A4;margin:12mm 13mm 14mm}
@media print{
  body{background:#fff!important;color:#000!important}
  body>*:not(#print){display:none!important}
  #print{display:block}
  #print .sheet{page:card;width:210mm;height:297mm;position:relative;break-after:page;overflow:hidden}
  #print .sheet .pc{box-shadow:none}
  #print .cat{page:cat}
  #print .mbp{break-after:page}
  #print .paper{box-shadow:none;padding:0;max-width:none;border-radius:0}
  #print .cat .pb{border:0;margin:0;break-after:page}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

 <div class="row" id="t_single"><label>Geschlecht<select id="t_s"><option value="1,0">1,0 Rammler</option><option value="0,1">0,1 Häsin</option></select></label>

 <div class="row"><label>Zuchtgruppe<select id="g_kl">${KL().map(([v,l])=>`<option value="${v}" ${v==='III'?'selected':''}>${l}</option>`).join('')}</select></label></div>

 <div class="tbl"><table><thead><tr><th class="num">Käfig</th><th>S</th><th>Rasse</th><th>Farbe</th><th>Ge</th><th>Kennzeichnung</th><th>Aussteller</th><th class="num">Verkauf</th><th></th></tr></thead><tbody>
 ${(()=>{const L=sorted();const K=L.map(t=>{const g=zgOf(t,G);return g?g.key:null});return L.map((t,i)=>{const g=zgOf(t,G);const cl=(K[i]?K[i+1]!==K[i]:!!K[i+1])?'sgEnd':'';return `<tr${cl?` class="${cl}"`:''}><td class="num"><b>${t.kaefig??'<span class="pill warn">neu</span>'}</b></td><td>${g?g.nr:'<span class="ez" title="Einzeltier">EZ</span>'}</td><td>${esc(t.rasse)}${t.nurVerkauf?' <span class="pill warn">nur Verkauf</span>':''}</td><td>${esc(t.farbe)}</td><td class="sex">${t.geschlecht}${S.regeln.altjung&&t.alter==='jung'?' <span class="pill">jt</span>':''}</td><td>${esc(t.tR)} ${esc(t.tL)}</td><td>${esc(zu(t.zuechterId).name)}</td><td class="num">${t.verkauf?fz(t.verkauf).replace(',0',',00')+' €':''}</td><td><button class="ghost small" data-editt="${t.id}">Bearbeiten</button> <button class="ghost small" data-delt="${t.id}">Löschen</button></td></tr>`}).join('')})()||'<tr><td colspan="9" class="hint">Noch keine Tiere gemeldet. Wähle oben Aussteller, Rasse und Farbe und klicke auf Melden.</td></tr>'}

function cardSel(){const d=S.druck;const v=+d.von||1,b=+d.bis||1e9;

function meldebogenB(z){const G=gruppen();const L=sorted().filter(t=>t.zuechterId===z.id);const nS=new Set(L.map(t=>zgOf(t,G)).filter(Boolean)).size;
  const fT=fee('feeTier'),fS=fee('feeSlg'),fU=fee('feeUm'),fK=fee('feeKat');const mg=L.length*fT,zs=nS*fS,zw=mg+zs+fK;
  const tr=(x,sl)=>`<tr><td class="k">${x.kaefig??'–'}</td><td class="zg">${sl}</td><td style="white-space:normal">${esc(x.rasse)}<br><span class="fb">${esc(x.farbe)}${x.nurVerkauf?' · nur Verkauf':''}</span></td><td>${x.geschlecht}${S.regeln.altjung&&x.alter==='jung'?' jt':''}</td><td>${esc(x.tR)} ${esc(x.tL)}</td><td class="vk">${x.verkauf?eur(x.verkauf):''}</td><td class="um"></td><td class="fee">${eur(fT)}</td></tr>`;

    else{rows+=`<tbody class="unit">${tr(t,'')}</tbody>`;i++}}
  const ln=(w=28)=>`<span class="line" style="min-width:${w}mm"></span>`;
  return `<div class="mb"><div class="kick">Meldebogen B · Einsetzliste</div><h1>${esc(z.name)}</h1>

   <p style="margin:4mm 0 2mm">Bitte setzen Sie Ihre Tiere in die angegebenen Käfige. ${L.length} Tiere${nS?`, davon ${nS} Sammlung${nS>1?'en':''}`:''}. Änderungen tragen Sie rechts unter „Ummeldung“ ein.</p>

    <tr class="sub"><td>Zwischensumme</td><td></td><td class="b">${eur(zw)}</td></tr>
    <tr><td>Ummeldungen</td><td>${ln(12)} Tiere × ${eur(fU)}</td><td class="b">${ln()} €</td></tr>

function meldebogenA(){const sc=S.schau;const ms=sc.meldeschluss?new Date(sc.meldeschluss+'T12:00').toLocaleDateString('de-DE'):'';const aj=S.regeln.altjung;

      const row=inp.closest('tr');const setI=(j,val,cls)=>{const x=row.querySelector(`[data-i="${j}"]`);if(x){x.value=val;x.className='pos'+(cls?' '+cls:'')}};const gI=$('p_'+t.id);
      const MK=['nb','fehlt'];const wasNb=MK.includes(t.pos[k]);const vl=v.toLowerCase();
      if(MK.includes(vl)){t.pos[k]=vl;inp.className='pos ok';inp.value=vl;for(let j=0;j<7;j++){if(j>k){t.pos[j]='-';setI(j,'-','ok')}else if(j<k&&MK.includes(t.pos[j])){t.pos[j]=null;setI(j,'')}}t.punkte=vl==='nb'?'nbf':'fehlt';if(gI){gI.value=vl;gI.className='pts ok'}upd(t);save();prog();return}
      const isMk=t.punkte==='nbf'||t.punkte==='fehlt';
      if(wasNb||isMk&&t.pos.includes('-')){for(let j=k+1;j<7;j++)if(t.pos[j]==='-'){t.pos[j]=null;setI(j,'')}if(isMk){t.punkte=null;if(gI){gI.value='';gI.className='pts'}}}
      if(v==='-'){t.pos[k]=null;inp.value='';inp.className='pos'}
      else if(v===''){t.pos[k]=null;inp.className='pos'}else{const n=parseFloat(v);if(isNaN(n)||n<0||n>POSMAX[k]||Math.round(n*2)!==n*2){inp.className='pos bad';inp.title=`0 bis ${POSMAX[k]} in halben Punkten, oder nb bzw. fehlt`;return}t.pos[k]=n;inp.className='pos ok';inp.value=fz(n)}
      if(posFull(t)){const sm=t.pos.reduce((a,b)=>a+b,0);t.punkte=sm;const g=$('p_'+t.id);if(g){g.value=fz(sm);g.className='pts ok'}}
      upd(t);save();prog()});
      inp.addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();inp.dispatchEvent(new Event('change'));const k=+inp.dataset.i;const row=inp.closest('tr');let nx=null;
        if(k<6)nx=row.querySelector(`[data-i="${k+1}"]`);else{let r=row.nextElementSibling;while(r&&!r.querySelector('[data-i="0"]'))r=r.nextElementSibling;nx=r?r.querySelector('[data-i="0"]'):null}
        if(nx){nx.focus();nx.select()}})});
    all('[data-pr]').forEach(i=>i.addEventListener('input',()=>{S.tiere.find(t=>t.id===i.dataset.pr).preis=i.value.trim();save()}));
    all('[data-zp]').forEach(i=>i.addEventListener('input',()=>{S.zgPreis[i.dataset.zp]=i.value.trim();save()}));
    $('bAuto').onclick=()=>ask('Die Preise aus dem Reiter Sieger werden in die Preisfelder eingetragen. Andere, von Hand eingetragene Preise bleiben stehen.',()=>{autoPreise();commit()});
    $('bClearP').onclick=()=>ask('Alle Punkte und Preise werden gelöscht. Tiere und Züchter bleiben.',()=>{S.tiere.forEach(t=>{t.punkte=null;t.pos=null;t.preis=''});S.zgPreis={};commit()})}
  if(c==='sieger'){
    all('[data-pz] [data-f]').forEach(i=>i.addEventListener('change',e=>{const p=S.preise.find(x=>x.id===e.target.closest('[data-pz]').dataset.pz);p[e.target.dataset.f]=e.target.value;commit()}));
    all('[data-delpz]').forEach(b=>b.onclick=()=>{S.preise=S.preise.filter(p=>p.id!==b.dataset.delpz);commit()});
    $('bAuto2').onclick=()=>ask('Die Preise werden in die Preisfelder im Reiter Bewertung eingetragen. Andere, von Hand eingetragene Preise bleiben stehen.',()=>{autoPreise();commit()});
    $('addPz').onclick=()=>{S.preise.push({id:uid(),name:'Neuer Preis',art:'tier',geschl:'alle',kreis:'alle'});commit()}}
  if(c==='katalog')$('bPrintCat').onclick=()=>{document.getElementById('print').innerHTML=`<div class="paper cat">${katalogHTML()}</div>`;doPrint()}}
function printCards(){const l=cardSel(),d=S.druck,test=d.modus==='test';let h='';
  for(let i=0;i<l.length;i+=4){h+='<div class="sheet">';l.slice(i,i+4).forEach((x,j)=>{const html=karte(x,test);
    h+=html.replace('<div class="pc','<div style="left:'+((j%2)*105+d.dx)+'mm;top:'+(Math.floor(j/2)*148.5+d.dy)+'mm" class="pc')});h+='</div>'}
  document.getElementById('print').innerHTML=h;doPrint()}
function doPrint(){if(inFrame){ask('Drucken geht in dieser Vorschau nicht. Bitte die heruntergeladene Programmdatei im Browser öffnen und dort auf Drucken klicken.',null);return}try{window.print()}catch(e){}}
function ask(msg,yes){const b=document.getElementById('confirmBar');b.hidden=false;
  b.innerHTML=yes?`<b>Sicher?</b> ${esc(msg)} <button class="small" id="cy">Ja, weiter</button> <button class="ghost small" id="cn">Abbrechen</button>`:`${esc(msg)} <button class="ghost small" id="cn">Schließen</button>`;
  if(yes)document.getElementById('cy').onclick=()=>{b.hidden=true;yes()};document.getElementById('cn').onclick=()=>b.hidden=true;b.scrollIntoView({block:'center',behavior:'smooth'})}

document.getElementById('bExport').onclick=()=>{if(inFrame){ask('In dieser Vorschau kann keine Datei gespeichert werden. Deine Eingaben bleiben automatisch im Browser. Für eine Datei die Offline-Version öffnen.',null);return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`kaninchenschau-${S.schau.datum||'daten'}.json`;document.body.appendChild(a);a.click();a.remove()};
document.getElementById('fImport').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.schau||!d.tiere||d.v!==2)throw 0;S=d;commit()}catch(err){ask('Diese Datei stammt nicht aus diesem Programm. Es wurde nichts geändert.',null)}};r.readAsText(f)};
document.getElementById('bNew').onclick=()=>ask('Tiere und Bewertungen werden gelöscht. Züchter, Rassen, Grußworte, Werbung und Preise bleiben für die nächste Schau.',()=>{S.tiere=[];S.zgKlasse={};S.sample=false;S.schau.datum='';location.hash='tiere';commit()});
window.addEventListener('hashchange',render);
if(!S.mig5){S.grussworte=[];S.zgPreis=S.zgPreis||{};S.tiere.forEach(t=>{if(t.nurVerkauf==null)t.nurVerkauf=false});autoPreise();S.mig5=true;save()}
if(!S.mig6){S.schau.rassen=RASSEN_TXT;const R6=rassen();const names=new Set(R6.map(r=>r.name));const abk=n=>(String(n).match(/\(([^)]+)\)\s*$/)||[])[1];const map={};
  S.tiere.forEach(t=>{t.farbe=(t.farbe||'').trim();if(!names.has(t.rasse)){const hit=R6.find(r=>abk(r.name)===abk(t.rasse));if(hit)map[t.rasse]=hit.name}});
  const rekey=o=>{const n={};Object.entries(o||{}).forEach(([k,v])=>{const q=k.split('|');if(map[q[1]])q[1]=map[q[1]];n[q.join('|')]=v});return n};
  S.zgKlasse=rekey(S.zgKlasse);S.zgPreis=rekey(S.zgPreis);S.tiere.forEach(t=>{if(map[t.rasse])t.rasse=map[t.rasse]});S.mig6=true;save()}
if(inFrame)document.getElementById('frameNote').hidden=false;
render();
</script>
